<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Session B</title>
<style>
  :root { --bg:#f6f4ef; --ink:#14213d; --muted:#5b6475; --petrol:#0f5c63; --line:#d9d4c7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:26px; margin:0 0 8px; }
  p { margin:0 0 16px; color:var(--muted); }
  a.go { display:block; text-align:center; background:var(--petrol); color:#fff; text-decoration:none;
         font-weight:600; padding:16px; border-radius:10px; margin:24px 0; }
  pre { white-space:pre-wrap; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; font:15px/1.5 ui-monospace, Consolas, monospace; color:var(--ink); }
  button { background:none; border:1px solid var(--line); border-radius:8px; padding:8px 14px; font:inherit; color:var(--ink); cursor:pointer; }
  .bad { color:#9b2c2c; }
</style>
</head>
<body>
<main>
  <h1 id="h">Session B</h1>
  <p>Abre esta página en el PC, con VS Code abierto en <b>zevari-linkedin-content</b>. El botón abre Claude Code con la orden escrita; nada sale hasta que pulses Enter.</p>
  <a class="go" id="go" href="#">Abrir Claude Code</a>
  <p>Si el botón no hace nada, copia la orden y pégala en Claude Code:</p>
  <pre id="prompt"></pre>
  <button id="copy" type="button">Copiar</button>
</main>
<script>
  // Only a week number and a Gmail thread id are accepted; the prompt is built here, never taken from the URL.
  var q = new URLSearchParams(location.search);
  var w = (q.get('w') || '').toUpperCase();
  var t = q.get('t') || '';
  var go = document.getElementById('go'), pre = document.getElementById('prompt');
  if (!/^W\d{2}$/.test(w)) {
    document.getElementById('h').textContent = 'Enlace incompleto';
    go.style.display = 'none';
    pre.textContent = 'Falta la semana (w=W46). Abre Claude Code en zevari-linkedin-content y pide la Session B a mano.';
    pre.className = 'bad';
  } else {
    if (!/^[0-9a-f]{10,20}$/.test(t)) t = '';
    var prompt = 'Session B ' + w + ': mi aprobación del digest "[APROBAR] Contenido semana ' + w + '" está en Gmail' +
      (t ? ' (hilo ' + t + ')' : '') + '. Lee el hilo, aplica solo lo que aprobé y ejecuta la Session B de workflows/weekly-content.md para ' + w + '.';
    document.getElementById('h').textContent = 'Session B ' + w;
    pre.textContent = prompt;
    go.href = 'vscode://anthropic.claude-code/open?prompt=' + encodeURIComponent(prompt);
  }
  document.getElementById('copy').onclick = function () {
    try { navigator.clipboard.writeText(pre.textContent); this.textContent = 'Copiado'; } catch (e) {}
  };
</script>
</body>
</html>
